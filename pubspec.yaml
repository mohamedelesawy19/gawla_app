name: gawla_app
description: "A real-time multiplayer party game where players compete through fast-paced mini-game tournaments until only one champion remains"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.3.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  dartz: ^0.10.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # Image Caching
  cached_network_image: ^3.4.1

  # Dependency Injection
  get_it: ^9.2.1

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6

  # Third-Party Sign-In
  google_sign_in: ^7.2.0

  # UI
  cupertino_icons: ^1.0.9
  shimmer_animation: ^2.2.2+1
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
